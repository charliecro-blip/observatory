name: CI

on:
  push:
    branches: [main, feat/tides-app]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's "packageManager" field is
      # the single source of truth. Specifying both makes action-setup abort:
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regressions first: pure, sub-second, and every case is a bug that
      # actually shipped. Run from three zones — both the local-day and the
      # notifier bugs were invisible from UTC, which is exactly where a default
      # runner sits.
      - name: Regressions (America/Chicago — DST)
        run: pnpm test
        env: { TZ: America/Chicago }
      - name: Regressions (Asia/Kolkata — half-hour zone)
        run: pnpm test
        env: { TZ: Asia/Kolkata }
      - name: Regressions (UTC)
        run: pnpm test
        env: { TZ: UTC }

      - name: Typecheck — Compass frontend
        run: pnpm --filter @workspace/tides run typecheck

      # NOT GATING YET: the api-server and root typechecks are red on a
      # long-standing inherited baseline. Reported so the count stays visible
      # and shrinking, but not failing the build until it reaches zero — see
      # BACKLOG. Worth taking seriously rather than muting: one entry in that
      # baseline turned out to be a live 500 on every calendar export.
      - name: Typecheck — api-server (report only)
        continue-on-error: true
        run: pnpm --filter @workspace/api-server run typecheck
