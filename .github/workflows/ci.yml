name: CI

on:
  push:
    branches: [main, feat/tides-app]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's "packageManager" field is
      # the single source of truth. Specifying both makes action-setup abort:
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regressions first: pure, sub-second, and every case is a bug that
      # actually shipped. Run from three zones — both the local-day and the
      # notifier bugs were invisible from UTC, which is exactly where a default
      # runner sits.
      - name: Regressions (America/Chicago — DST)
        run: pnpm test
        env: { TZ: America/Chicago }
      - name: Regressions (Asia/Kolkata — half-hour zone)
        run: pnpm test
        env: { TZ: Asia/Kolkata }
      - name: Regressions (UTC)
        run: pnpm test
        env: { TZ: UTC }

      - name: Typecheck — Compass frontend
        run: pnpm --filter @workspace/tides run typecheck

      # api-server's OWN source is now clean — the ~20 inherited errors are
      # fixed, and THREE of them turned out to be live bugs (a 500 on every
      # calendar export, a Studio card that never applied its before-sunrise
      # day ruler, and share cards rendering in Helvetica instead of the brand
      # serif). What remains is TS6305 project-reference noise from upstream
      # legacy libs (api-zod export ambiguity, the openai integration libs),
      # which is why this can't gate yet. Report-only until that chain is
      # untangled — but the count is now "16 project-reference complaints",
      # not "20 unread errors that might be real".
      - name: Typecheck — api-server (report only; TS6305 upstream)
        continue-on-error: true
        run: pnpm --filter @workspace/api-server run typecheck
