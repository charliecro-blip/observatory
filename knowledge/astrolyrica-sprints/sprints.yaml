# sprints — transit windows turned into short, tally-able pushes.
# A NEW collection: transiting planet x aspect mode -> concrete sprint ideas. When a
# fast planet (Sun/Mercury/Venus/Mars/Jupiter) holds a major aspect to another over
# a 3-21 day window, this supplies what kind of push the SHAPE suggests plus concrete
# things to actually run. Aspect->mode: conjunction=begin, sextile=offer, square=
# friction, trine=ease, opposition=face. Describe conditions, never promise outcomes;
# no health/financial claims; no streak/competition framing. Every entry carries `avoid`.

sprints:
- id: sun_begin
  transiting_planet: sun
  mode: begin
  aspect: conjunction
  push: a showing-up push
  register: a showing-up push — the two fold into one — a fresh start with the fuse lit
  ideas:
  - post one thing you made, daily
  - put your name on one thing a day
  avoid:
  - streak or challenge framing (day 3 of 7, don't break it)
  - treating the window as a command from the sky
  - visibility mistaken for the work
- id: sun_offer
  transiting_planet: sun
  mode: offer
  aspect: sextile
  push: a showing-up push
  register: a showing-up push — an opening, low-friction — a light run at it if you reach
  ideas:
  - share one small win a day
  - let one person see the work each day
  avoid:
  - streak or challenge framing (day 3 of 7, don't break it)
  - treating the window as a command from the sky
  - visibility mistaken for the work
- id: sun_friction
  transiting_planet: sun
