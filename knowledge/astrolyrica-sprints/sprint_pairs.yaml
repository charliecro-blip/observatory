# sprint_pairs — the SPECIFIC layer: transiting planet x aspect x target planet.
# Where sprints.yaml gives the generic push-by-shape, this gives target-specific,
# aspect-differentiated ideas so Mars square Saturn (the deferred grind) reads unlike
# Mars square Neptune (discipline against fog). High-signal pairings only; the engine
# tries the specific pair first and falls back to sprints.yaml. Describe conditions,
# never promise; no health/financial claims; no streak/competition framing. Every
# entry carries `avoid`.

sprint_pairs:
