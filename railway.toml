[build]
# ORDER MATTERS. The schema push used to run FIRST, so a build that then failed
# still left production's schema mutated — code and schema could disagree with
# nothing to roll back to. Now: install → regression tests → build both apps →
# and only then touch the database. A broken build or a failed invariant can no
# longer reach the schema.
#
# The root `pnpm run typecheck` joined the build on 2026-08-16, typecheck
# before tests so the cheap gate fails first. It was kept out while it failed
# on the legacy health-tracker app — and only there: the old note here blamed
# lib/integrations-openai-ai-{react,server}, but measured, every root error
# lived in health-tracker's pages, and the -server lib is a LIVE dependency of
# Compass's AI routes. The estate is deleted; the gate is armed.
#
# NOTE: this is still `drizzle-kit push`, which diffs and applies directly with
# no versioned history and no rollback. Moving to generated, versioned
# migrations is the real fix and is tracked in BACKLOG §2 — it needs a
# supervised baseline against the live database (the tables already exist, so
# the first generated migration has to be marked applied rather than run), and
# that is not something to attempt unattended.
# WHICH CHANGES TRIGGER A DEPLOY. This list is the one to edit.
#
# It used to live on the service in Railway's dashboard, invisible from the
# repo, reading `/artifacts/api-server/**` and `/artifacts/tides/**` and
# nothing else — so a commit touching only `lib/` was marked SKIPPED and never
# shipped, while `gh api .../status` reported success.
#
# The dashboard field is now `**` (Railway's own documented match-everything,
# from the docs' `**` / `!/*.md` example) rather than empty: an empty list
# reads back as `[]`, and "when specified, any changes that don't match the
# patterns will skip" makes an empty list mean NOTHING matches. `**` cannot be
# misread. So the dashboard filters nothing and this file decides.
# It happened once for real (a copy fix in lib/lexicon) and self-corrected only
# because a later commit touched artifacts/ and carried it along.
#
# The dangerous case had not happened yet: a change under lib/db/src/schema
# alone would neither deploy NOR run `drizzle-kit push`, so the schema the code
# expects and the schema in production could part company silently.
#
# Everything the build reads is listed. tests/ is here on purpose — the suite
# runs inside the build, so a test change should get the chance to fail the
# deploy rather than wait to block someone else's.
watchPatterns = [
  "artifacts/api-server/**",
  "artifacts/tides/**",
  "lib/**",
  "scripts/**",
  "tests/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.json",
  "vitest.config.ts",
  "railway.toml",
]

buildCommand = "pnpm install --frozen-lockfile && pnpm run typecheck && pnpm test && pnpm --filter @workspace/tides run build && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/db run push"

[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "tides-api"
