<style>
/* Layout: one phone-width column that the sky colors. Today leads with the next wave; Now asks what this moment is for. */
:root {
  --bg: #F3EEE4; --surface: #FFFFFF; --surface2: #E9E1D2; --ink: #10233A; --muted: #5B6B7C; --line: #E2D8C6;
  --accent: #1E6E8C; --accent-ink: #F7F3EA; --warm: #E26D4F; --sea: #80ACA9; --hero: #1E6E8C; --hero-ink: #F7F3EA; --hero-line: transparent;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif; --text: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
:root[data-phase="dawn"]   { --bg: #F1E2D6; --surface: #FBF3EC; --surface2: #EAD6C8; --ink: #24303F; --muted: #6A707C; --line: #E2CDBF; --accent: #536D80; --accent-ink: #FBF3EC; --warm: #B86F5C; --sea: #91A8AF; --hero: #536D80; --hero-ink: #FBF3EC; }
:root[data-phase="golden"] { --bg: #EFD9B4; --surface: #F9EDD6; --surface2: #E5C99C; --ink: #2A2735; --muted: #6A5B52; --line: #DCC193; --accent: #515D7D; --accent-ink: #F9EDD6; --warm: #A65A43; --sea: #A57978; --hero: #515D7D; --hero-ink: #F9EDD6; }
:root[data-phase="night"]  { --bg: #0E1B33; --surface: #16264A; --surface2: #1E3158; --ink: #EFE9DC; --muted: #9AA7C0; --line: #26395F; --accent: #5FE0CC; --accent-ink: #0E1B33; --warm: #D9B46A; --sea: #5FE0CC; --hero: #16264A; --hero-ink: #EFE9DC; --hero-line: #2F4A7A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--text); transition: background .6s, color .6s; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 96px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.stars { position: absolute; left: 0; top: 0; width: 100%; height: 150px; pointer-events: none; display: none; }
:root[data-phase="night"] .stars { display: block; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; text-wrap: balance; }
h1 { font-size: 28px; line-height: 1.1; }
h2 { font-size: 20px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.g { font-family: 'Apple Symbols', 'Segoe UI Symbol', 'Noto Sans Symbols', 'DejaVu Sans', sans-serif; font-variant-emoji: text; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border-radius: 18px; padding: 14px 16px; }
.hero { background: var(--hero); color: var(--hero-ink); border: 1px solid var(--hero-line); border-radius: 24px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 4px; }
.hero .top { display: flex; justify-content: space-between; font-size: 13px; opacity: .85; gap: 8px; }
.hero .big { display: flex; align-items: baseline; gap: 12px; }
.hero .time { font-family: var(--display); font-size: 58px; line-height: 1; letter-spacing: -.02em; }
.hero .time small { font-size: 20px; letter-spacing: 0; margin-left: 2px; }
.hero .glyph { font-size: 34px; }
.hero .word { font-family: var(--display); font-style: italic; font-size: 22px; }
.hero .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 11px 15px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; }
.btn.ghost { background: transparent; color: inherit; border: 1px solid currentColor; opacity: .9; }
.btn.soft { background: var(--surface2); color: var(--ink); }
.btn.wide { width: 100%; padding: 14px; font-size: 15px; }
.hero .btn { background: var(--hero-ink); color: var(--hero); }
:root[data-phase="night"] .hero .btn { background: var(--accent); color: var(--accent-ink); }
.hero .btn.ghost { background: transparent; color: var(--hero-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px; font-size: 13px; background: var(--surface2); border: 0; color: var(--ink); }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.tier { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.tier.strong { background: var(--warm); color: var(--bg); }
.tier.supportive { background: var(--surface2); color: var(--ink); }
.tier.open { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 26px 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.item .g { color: var(--accent); font-size: 18px; text-align: center; }
.item.strong .g { color: var(--warm); }
.item .t { font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.item.busy { color: var(--muted); }
.item.busy .t { font-family: var(--text); font-weight: 400; font-size: 14px; }
.item.past { opacity: .45; }
.span { border-radius: 18px; padding: 12px 14px; background: var(--surface2); display: flex; gap: 12px; align-items: center; border: 0; text-align: left; width: 100%; }
.span .g { font-size: 26px; color: var(--accent); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { display: flex; justify-content: space-around; width: 100%; max-width: 460px; }
nav.tabs button { background: none; border: 0; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; }
nav.tabs button .g { font-size: 18px; }
nav.tabs button.on { color: var(--ink); }
.sheet-back { position: fixed; inset: 0; background: rgba(8, 14, 28, .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 92%; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; }
.receipt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.receipt .g { font-size: 18px; color: var(--accent); text-align: center; }
.receipt.against { color: var(--muted); }
.receipt.against .g { color: var(--muted); }
.bar { height: 6px; border-radius: 6px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.suit { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.suit.mine .nm::before { content: "\25CF"; color: var(--warm); margin-right: 6px; font-size: 10px; vertical-align: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
input[type=text], input[type=date], input[type=time], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 12px; padding: 3px; }
.seg button { background: none; border: 0; border-radius: 10px; padding: 9px 4px; font-size: 13px; }
.seg button.on { background: var(--surface); font-weight: 600; }
.day { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.day.inspan { border-left: 3px solid var(--sea); padding-left: 10px; }
.cells { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px; }
.cells i { aspect-ratio: 1; border-radius: 4px; background: var(--surface2); max-width: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40; max-width: 90%; }
.onb { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: 30px; }
.onb .lede { font-family: var(--display); font-size: 34px; line-height: 1.08; }
.share { border-radius: 24px; padding: 26px 22px; background: var(--hero); color: var(--hero-ink); display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--hero-line); }
.share .w { font-family: var(--display); font-size: 48px; font-style: italic; line-height: 1; }
.plusmark { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

<div class="app" id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="today"><span class="g">&#9737;&#xFE0E;</span>Today</button>
  <button data-tab="now"><span class="g">&#10022;</span>Now</button>

</div></nav>
<div id="layer"></div>

<script src="./core.js"></script>
<script>
(function () {
'use strict';
var P = window.StarswellPlan, HOST = window.AW_HOST || null, KEY = 'astrowaves-web';
var V = '︎', GL = { Sun: '☉', Moon: '☽', Mercury: '☿', Venus: '♀', Mars: '♂', Jupiter: '♃', Saturn: '♄', Uranus: '♅', Neptune: '♆', Pluto: '♇' };
var SG = { Aries: '♈', Taurus: '♉', Gemini: '♊', Cancer: '♋', Leo: '♌', Virgo: '♍', Libra: '♎', Scorpio: '♏', Sagittarius: '♐', Capricorn: '♑', Aquarius: '♒', Pisces: '♓' };
var CITIES = [
  ['Austin', 30.27, -97.74, 'America/Chicago'], ['San Antonio', 29.42, -98.49, 'America/Chicago'], ['Houston', 29.76, -95.37, 'America/Chicago'], ['Dallas', 32.78, -96.80, 'America/Chicago'],
  ['New Orleans', 29.95, -90.07, 'America/Chicago'], ['Chicago', 41.88, -87.63, 'America/Chicago'], ['Denver', 39.74, -104.99, 'America/Denver'], ['Santa Fe', 35.69, -105.94, 'America/Denver'],
  ['Phoenix', 33.45, -112.07, 'America/Phoenix'], ['Los Angeles', 34.05, -118.24, 'America/Los_Angeles'], ['San Francisco', 37.77, -122.42, 'America/Los_Angeles'], ['Portland', 45.52, -122.68, 'America/Los_Angeles'],
  ['Seattle', 47.61, -122.33, 'America/Los_Angeles'], ['New York', 40.71, -74.01, 'America/New_York'], ['Boston', 42.36, -71.06, 'America/New_York'], ['Atlanta', 33.75, -84.39, 'America/New_York'],
  ['Miami', 25.76, -80.19, 'America/New_York'], ['Toronto', 43.65, -79.38, 'America/Toronto'], ['Mexico City', 19.43, -99.13, 'America/Mexico_City'], ['London', 51.51, -0.13, 'Europe/London'],
  ['Berlin', 52.52, 13.40, 'Europe/Berlin'], ['Basel', 47.56, 7.59, 'Europe/Zurich'], ['Zurich', 47.38, 8.54, 'Europe/Zurich'], ['Lisbon', 38.72, -9.14, 'Europe/Lisbon'],
  ['Sydney', -33.87, 151.21, 'Australia/Sydney'], ['Tokyo', 35.68, 139.69, 'Asia/Tokyo']
];
var STARTERS = [['Quiet time to pray', 'meditate'], ['Getting to the gym', 'move'], ['Making art', 'create'], ['Writing', 'write'], ['Calling my people', 'connect'], ['Romance', 'partner'], ['Downtime', 'rest'], ['Deep work', 'focus']];

// ---------- state ----------
function blank() { return { v: 1, goals: [], loc: null, wake: 7, sleep: 22.5, done: [], saved: [], words: {}, look: 'sun', glyphs: true, ping: 'gentle', plus: true, freeView: false, birth: null, onboarded: false }; }
var S = (function () {
  var s = null;
  if (HOST && HOST.state) s = HOST.state;
  else { try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} }
  return Object.assign(blank(), s || {});
})();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (HOST) host('save', S);
  PLAN = null;
}
var hostQ = [];
function host(a, d) { hostQ.push({ a: a, d: d }); if (hostQ.length === 1) setTimeout(flushHost, 0); }
function flushHost() { if (!hostQ.length) return; var m = hostQ.shift(); if (HOST.post) { HOST.post(m.a, m.d); if (hostQ.length) setTimeout(flushHost, 0); return; } location.href = 'aw://x?a=' + m.a + '&d=' + encodeURIComponent(JSON.stringify(m.d)); if (hostQ.length) setTimeout(flushHost, 120); }
var BUSY = (HOST && HOST.busy || []).map(function (b) { return { title: b.title, start: new Date(b.start), end: new Date(b.end) }; });

// ---------- helpers ----------
var tz = function () { return (S.loc && S.loc.tz) || Intl.DateTimeFormat().resolvedOptions().timeZone; };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function g(pl) { return S.glyphs && GL[pl] ? '<span class="g">' + GL[pl] + V + '</span>' : ''; }
function gs(sign) { return S.glyphs && SG[sign] ? '<span class="g">' + SG[sign] + V + '</span> ' : ''; }
function word(pl, goal) { return (goal && goal.words && goal.words[pl]) || S.words[pl] || P.WORD[pl] || ''; }
function parts(d, o) { return new Date(d).toLocaleString('en-US', Object.assign({ timeZone: tz() }, o)); }
function hm(d) { return parts(d, { hour: 'numeric', minute: '2-digit' }).replace(/\s?(AM|PM)$/, ''); }
function ap(d) { return /AM$/.test(parts(d, { hour: 'numeric' })) ? 'am' : 'pm'; }
function tm(d) { return hm(d) + ' ' + ap(d); }
function range(a, b) { return ap(a) === ap(b) ? hm(a) + ' to ' + hm(b) + ' ' + ap(b) : tm(a) + ' to ' + tm(b); }
function wd(d) { return parts(d, { weekday: 'long' }); }
function ymd(d) { return parts(d, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
function dayName(d) { var n = new Date(); if (ymd(d) === ymd(n)) return 'Today'; if (ymd(d) === ymd(+n + 864e5)) return 'Tomorrow'; return wd(d); }
function localHour(d) { var p = parts(d, { hour: 'numeric', minute: '2-digit', hour12: false }).split(':'); return (+p[0] % 24) + (+p[1]) / 60; }
function hhmm(h) { var H = Math.floor(h), M = Math.round((h - H) * 60), d = new Date(2000, 0, 1, H, M); return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase(); }
function inMin(d) { var m = Math.round((+d - Date.now()) / 60000); if (m < 1) return 'now'; if (m < 60) return 'in ' + m + ' min'; var h = Math.floor(m / 60); if (h < 24) return 'in ' + h + ' h' + (m % 60 ? ' ' + (m % 60) : ''); return dayName(d); }
function plusOn() { return S.plus && !S.freeView; }
function goalName(gl) { return gl.label || (P.GOALS[gl.want] || {}).name || gl.want; }
function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
function isArtifact() { return !HOST && !/compass\.day$|localhost|127\.0\.0\.1/.test(location.hostname); }

// ---------- sky color follows the local sun ----------
var SUN = null;
function sunTimes() {
  if (!S.loc || !window.Astronomy) return null;
  var key = ymd(new Date()) + S.loc.lat; if (SUN && SUN.key === key) return SUN;
  try {
    var obs = new Astronomy.Observer(S.loc.lat, S.loc.lon, 0), from = new Date(Date.now() - 12 * 3600e3);
    var r = Astronomy.SearchRiseSet('Sun', obs, +1, from, 2), s = Astronomy.SearchRiseSet('Sun', obs, -1, r ? r.date : from, 2);
    SUN = { key: key, rise: r && r.date, set: s && s.date };
  } catch (e) { SUN = null; }
  return SUN;
}
function phase() {
  if (S.look === 'day') return 'day'; if (S.look === 'night') return 'night';
  var st = sunTimes(), n = Date.now(); if (!st || !st.rise || !st.set) { var h = new Date().getHours(); return h < 6 || h >= 19 ? 'night' : 'day'; }
  var r = +st.rise, s = +st.set, M = 60000;
  if (r > s) r -= 864e5; // after sunset today, next rise is tomorrow
  if (n >= r - 40 * M && n < r + 70 * M) return 'dawn';
  if (n >= s - 95 * M && n < s + 25 * M) return 'golden';
  if (n >= r + 70 * M && n < s - 95 * M) return 'day';

}
function paint() {
  var ph = phase(); document.documentElement.setAttribute('data-phase', ph);
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}

// ---------- the plan ----------
var PLAN = null, PLAN_AT = 0;
function natal() { return plusOn() && S.birth && S.birth.utc ? P.natalPositions(S.birth.utc) : null; }
function plan() {
  if (!S.loc || !S.goals.length) return null;
  if (PLAN && Date.now() - PLAN_AT < 10 * 60000) return PLAN;
  var goals = S.goals.map(function (x) { return { want: x.want, times: x.times, per: x.per, precision: x.precision }; });

  PLAN.goals.forEach(function (pg, i) { pg.mine = S.goals[i]; pg.windows.forEach(function (w) { w.goal = pg; w.id = pg.want + ':' + (+new Date(w.start)); w.clash = clash(w); }); pg.spans.forEach(function (w) { w.goal = pg; w.id = pg.want + ':span:' + (+new Date(w.start)); }); });

}
function clash(w) { var a = +new Date(w.at || w.start), b = a + ((w.goal && w.goal.dur) || 30) * 60000; return BUSY.filter(function (e) { return +e.start < b && +e.end > a; })[0] || null; }

// ---------- views ----------
var TAB = 'today', NOW_OFF = 0, WEEK_GOAL = 'all', LONG = 0;
var app = document.getElementById('app'), layer = document.getElementById('layer'), tabs = document.getElementById('tabs');
function render() {
  paint();
  var stars = '<svg class="stars" viewBox="0 0 390 150" preserveAspectRatio="none" aria-hidden="true">' + [[40, 30, 1.2], [96, 64, 1], [160, 22, 1.4], [214, 80, 1], [268, 38, 1.2], [330, 70, 1], [360, 24, 1.3], [128, 108, .9], [300, 118, .9]].map(function (s) { return '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="' + s[2] + '" fill="currentColor" opacity=".6"/>'; }).join('') + '</svg>';
  if (!S.onboarded) { tabs.hidden = true; app.innerHTML = stars + onboarding(); return; }
  tabs.hidden = false;
  [].forEach.call(tabs.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === TAB); });
  var v = { today: today, now: nowView, week: week, almanac: almanac, you: you }[TAB] || today;
  app.innerHTML = stars + v();
}

// Onboarding: what you would like more of, where you are, then your first wave (with "too early?").
var OB = { step: 0, text: '', guess: [], pick: null, times: 3, per: 'week' };
function onboarding() {
  if (OB.step === 0) return '<div class="onb">' +
    '<div class="eyebrow">Astrowaves</div>' +
    '<div class="lede">Check the stars like you check the weather.</div>' +
    '<p class="muted">Tell Astrowaves what you would like more of in your life. It finds the good times in your sky for it and lets you know before they come.</p>' +
    '<div style="flex:1"></div><button class="btn wide" data-act="ob-next">Begin</button>' +
    '<p class="small muted">Everything you tell it stays on this device.</p></div>';
  if (OB.step === 1) {

}
function addToCalendar(ws, mins, lead) {
  if (HOST) { ws.forEach(function (w) { host('cal', { title: goalName(w.goal.mine) + ' · ' + word(w.planet, w.goal.mine), start: w.kind === 'span' ? w.start : new Date(+new Date(w.at || w.start) - 5 * 60000), mins: w.kind === 'span' ? null : mins || w.goal.dur, allDay: w.kind === 'span', end: w.end, notes: (w.why || []).join('; ') + ' (Astrowaves)', lead: lead || 0 }); }); toast(ws.length > 1 ? 'Added ' + ws.length + ' to your calendar' : 'Added to your calendar'); return; }
  if (isArtifact()) { toast('Calendar files download at compass.day/waves'); return; }
  var ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Astrowaves//EN\r\n' + ws.map(function (w) { return icsEvent(w, mins || w.goal.dur, lead); }).join('\r\n') + '\r\nEND:VCALENDAR\r\n';
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'astrowaves.ics'; document.body.appendChild(a); a.click(); a.remove();
  toast('Open the file to add it to your calendar');
}

// ---------- events ----------
function logDone(want, how, w) {
  var gl = S.goals.filter(function (x) { return x.want === want; })[0] || {};
  S.done.push({ want: want, label: gl.label, at: (w && how === 'caught' ? new Date(w.at || w.start) : new Date()).toISOString(), how: how, wave: w ? w.id : null, planet: w ? w.planet : null, word: w ? word(w.planet, gl) : null });
  save();
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.classList.contains('sheet-back') && ev.target !== el) return;
  var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  if (el.hasAttribute('data-tab') && !a) { TAB = el.getAttribute('data-tab'); closeSheet(); render(); scrollTo(0, 0); return; }
  var w = id ? findWave(id) : null;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'ob-next': OB.step = 1; render(); break;
    case 'ob-starter': OB.text = v; OB.pick = null; render(); break;
    case 'ob-pick': OB.pick = v; render(); break;
    case 'ob-goal': {
      var gu = P.match(OB.text)[0], want = OB.pick || gu; if (!want) return;
      S.goals.push({ want: want, label: OB.text.trim().replace(/^./, function (c) { return c.toUpperCase(); }), times: +document.getElementById('ob-times').value, per: document.getElementById('ob-per').value });
      OB.text = ''; OB.pick = null; save();
      OB.step = S.goals.length >= 2 ? (S.loc ? 3 : 2) : 1; render(); break; }
    case 'ob-skip': OB.step = S.loc ? 3 : 2; render(); break;
    case 'ob-geo': navigator.geolocation.getCurrentPosition(function (pos) { S.loc = { lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, city: 'Where you are' }; save(); OB.step = 3; render(); }, function () { toast('Location was not shared. Pick a city instead.'); }); break;
    case 'ob-city': { var ci = document.getElementById('ob-city').value; if (ci === '') { toast('Pick a city first'); return; } var c = CITIES[+ci]; S.loc = { lat: c[1], lon: c[2], tz: c[3], city: c[0] }; save(); OB.step = 3; render(); break; }
    case 'ob-done': S.onboarded = true; save(); TAB = 'today'; render(); break;
    case 'wave': if (w) waveSheet(w); break;
    case 'remind': if (!w) break;
      if (S.saved.indexOf(w.id) < 0) S.saved.push(w.id); save();
      if (HOST) { host('ping', { id: w.id, at: w.at || w.start, lead: w.goal.mine.lead || w.goal.lead, title: goalName(w.goal.mine), word: word(w.planet, w.goal.mine), reason: w.reason }); toast('You will get a nudge ' + leadText(w.goal.mine.lead || w.goal.lead) + ' before'); }
      else addToCalendar([w], (document.getElementById('dur') || {}).value ? +document.getElementById('dur').value : w.goal.dur, w.goal.mine.lead || w.goal.lead);
      break;
    case 'cal': if (w) { if (S.saved.indexOf(w.id) < 0) S.saved.push(w.id); save(); addToCalendar([w], +(document.getElementById('dur') || {}).value || w.goal.dur, 0); } break;
    case 'share': if (w) shareSheet(w); break;
    case 'log': if (w) { logDone(w.goal.want, el.getAttribute('data-how'), w); toast(el.getAttribute('data-how') === 'skip' ? 'Noted in your almanac' : 'In your almanac'); render(); } break;
    case 'now-off': NOW_OFF = +v; render(); break;
    case 'suit': { if (NOW_OFF === 0 && S.goals.some(function (x) { return x.want === v; })) { logDone(v, 'other', null); var mm = momentAt(new Date()), r = mm.ranked.filter(function (x) { return x.want === v; })[0]; var last = S.done[S.done.length - 1]; if (r && r.score >= 2) { last.how = 'caught'; last.planet = r.planet; last.word = word(r.planet); } save(); toast('Recorded in your almanac'); render(); }
      else { var pg = (plan() || { goals: [] }).goals.filter(function (x) { return x.want === v; })[0]; if (pg) { var nx = pg.windows.filter(function (x2) { return +new Date(x2.end) > Date.now(); })[0]; if (nx) waveSheet(nx); } else toast('Add it under You to get waves for it'); } break; }
    case 'wk-goal': WEEK_GOAL = v; render(); break;
    case 'long': LONG = +v; render(); break;
    case 'spanlong': toast('Open the week view inside that stretch for its sharpest waves'); break;
    case 'planweek': planWeekSheet(); break;
    case 'planweek-add': { var ch = [].filter.call(document.querySelectorAll('[data-pick]'), function (x) { return x.checked; }).map(function (x) { return PICKS[+x.getAttribute('data-pick')]; }); ch.forEach(function (x) { if (S.saved.indexOf(x.id) < 0) S.saved.push(x.id); }); save(); addToCalendar(ch, null, null); closeSheet(); break; }
    case 'logsheet': logSheet(); break;
    case 'lognow': { var gl = S.goals[+el.getAttribute('data-i')], mm2 = momentAt(new Date()), r2 = mm2.ranked.filter(function (x) { return x.want === gl.want; })[0]; logDone(gl.want, r2 && r2.score >= 2 ? 'caught' : 'other', null); var l2 = S.done[S.done.length - 1]; if (r2 && r2.score >= 2) { l2.planet = r2.planet; l2.word = word(r2.planet, gl); } save(); closeSheet(); toast('In your almanac'); render(); break; }
    case 'export': { var data = JSON.stringify({ exported: new Date().toISOString(), goals: S.goals, done: S.done }, null, 1); if (HOST) { host('export', { text: data }); break; } try { navigator.clipboard.writeText(data).then(function () { toast('Copied your record'); }, function () { sheet('<h2>Your record</h2><textarea style="min-height:240px">' + esc(data) + '</textarea>'); }); } catch (e) { sheet('<h2>Your record</h2><textarea style="min-height:240px">' + esc(data) + '</textarea>'); } break; }
    case 'editgoal': goalSheet(+el.getAttribute('data-i')); break;
    case 'addgoal': goalSheet(null); break;
    case 'goal-save': {
      var label = document.getElementById('g-label').value.trim(), want2 = document.getElementById('g-want').value || P.match(label)[0];
      if (!want2) { toast('Pick what Astrowaves should read it as'); return; }
      var obj = { want: want2, label: label || P.GOALS[want2].name, times: +document.getElementById('g-times').value, per: document.getElementById('g-per').value };
      var gi = el.getAttribute('data-i'); if (gi === '') S.goals.push(obj); else S.goals[+gi] = Object.assign(S.goals[+gi], obj);
      save(); closeSheet(); render(); break; }
    case 'goal-del': S.goals.splice(+el.getAttribute('data-i'), 1); save(); closeSheet(); render(); break;
    case 'ping': S.ping = v; save(); render(); break;
    case 'look': S.look = v; save(); render(); break;
    case 'birth': {
      var bd = document.getElementById('b-date').value, bt = document.getElementById('b-time').value || '12:00', bz = document.getElementById('b-tz').value;
      if (!bd) { toast('Add your birth date'); return; }
      var p2 = bd.split('-').map(Number), q = bt.split(':').map(Number), guess = Date.UTC(p2[0], p2[1] - 1, p2[2], q[0], q[1]);
      var utc = guess - Sky.offsetMin(new Date(guess), bz) * 60000; utc = guess - Sky.offsetMin(new Date(utc), bz) * 60000;
      S.birth = { date: bd, time: bt, tz: bz, utc: new Date(utc).toISOString() }; save(); render(); toast('Your chart is in'); break; }
    case 'reset': if (el.getAttribute('data-sure')) { S = blank(); save(); OB = { step: 0, text: '', guess: [], pick: null, times: 3, per: 'week' }; render(); } else { el.setAttribute('data-sure', '1'); el.textContent = 'Tap again to erase everything'; } break;
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'ob-text') { OB.text = t.value; OB.pick = null; clearTimeout(t._d); t._d = setTimeout(function () { var pos = t.selectionStart; render(); var n = document.getElementById('ob-text'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 450); }
  if (t.id === 'now-range') { NOW_OFF = +t.value; clearTimeout(t._d); t._d = setTimeout(function () { render(); var r = document.getElementById('now-range'); if (r) r.focus(); }, 160); }
  if (t.hasAttribute('data-word')) { S.words[t.getAttribute('data-word')] = t.value.trim(); clearTimeout(t._d); t._d = setTimeout(save, 400); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.getAttribute('data-set')) { S[t.getAttribute('data-set')] = +t.value; save(); render(); }
  if (t.id === 'glyphs') { S.glyphs = t.checked; save(); render(); }
  if (t.id === 'freeview') { S.freeView = t.checked; save(); render(); }
  if (t.id === 'you-city' && t.value !== '') { var c = CITIES[+t.value]; S.loc = { lat: c[1], lon: c[2], tz: c[3], city: c[0] }; SUN = null; save(); render(); }
  if (t.id === 'ob-times') OB.times = +t.value;
  if (t.id === 'ob-per') OB.per = t.value;
});
if (S.onboarded && S.loc && S.goals.length) OB.step = 3;
if (!S.onboarded && S.goals.length) OB.step = S.loc ? 3 : 2;
window.AW = { render: render, state: function () { return S; }, setBusy: function (b) { BUSY = b.map(function (x) { return { title: x.title, start: new Date(x.start), end: new Date(x.end) }; }); PLAN = null; render(); } };
render();
setInterval(function () { if (!layer.innerHTML && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'SELECT') render(); }, 60000);
})();
</script>
