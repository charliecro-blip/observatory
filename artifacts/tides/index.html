<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Compass</title>
    <meta name="description" content="Move with time — lunar cycles, planetary hours, and daily rhythm." />
    <meta name="theme-color" content="#1a2a3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Compass" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="Compass" />
    <meta property="og:description" content="Move with time — lunar cycles, planetary hours, and daily rhythm." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />

    <!-- Type: Spectral (editorial serif), Space Grotesk + Geist (UI/body), Geist Mono (numerals) -->

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- A LINK THAT SURVIVES JAVASCRIPT BEING OFF.
         The app renders its own privacy link on the signup screen, which is
         where a person looks. This one is for the reader who never runs the
         bundle: a verification reviewer with a crawler, or anyone whose
         browser did not execute. compass.day served no privacy link at all in
         its HTML until now, so a reviewer fetching the page saw an empty
         <div id="root"> and nothing else.
         `hidden` keeps it out of the visual layout; it stays in the markup and
         in the accessibility tree, and screen-reader users get a real link on
         the landing page rather than a decoration. -->
    <noscript>
      <p><a href="/privacy">Privacy Policy</a></p>
    </noscript>
    <a href="/privacy" hidden>Privacy Policy</a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
