<style>
#compass-story {--paper:light-dark(#f5f1e7,#151a1e);--ink:light-dark(#232923,#eee9de);--muted:light-dark(#5c625b,#b9bcb4);--rule:light-dark(#ccc7ba,#49514e);--accent:light-dark(#76602c,#d7bd76);color:var(--ink);font-family:Arial,sans-serif;max-width:520px;margin:auto}
#compass-story .controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}#compass-story button{font:inherit;min-height:44px;padding:8px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);cursor:pointer}#compass-story button[aria-pressed=true]{border:2px solid var(--accent)}
#compass-story .sheet{background:var(--paper);padding:clamp(20px,5vw,36px);border:1px solid var(--rule)}#compass-story .edition{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px}#compass-story h2{font-family:Georgia,serif;font-size:clamp(32px,6vw,45px);line-height:1.08;font-weight:400;margin:25px 0 12px}#compass-story .intro{font-family:Georgia,serif;font-size:19px;line-height:1.45;margin-bottom:24px}#compass-story .row{display:grid;grid-template-columns:95px 1fr;gap:14px;border-top:1px solid var(--rule);padding:13px 0;line-height:1.4;font-size:15px}#compass-story .date{color:var(--accent);font-weight:600}#compass-story .reason{display:block;color:var(--muted);font-size:13px;margin-top:4px}#compass-story .foot{border-top:1px solid var(--rule);padding-top:15px;font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}#compass-story .coverline{font-family:Georgia,serif;font-size:25px;line-height:1.6;margin:36px 0}#compass-story .star{color:var(--accent)}
</style>
<div id="compass-story" aria-label="Compass carousel storyboard">
<div class="controls" aria-label="Preview slide"><button type="button" data-page="0" aria-pressed="true">Cover</button><button type="button" data-page="1" aria-pressed="false">Month ahead</button><button type="button" data-page="2" aria-pressed="false">Workouts</button><button type="button" data-page="3" aria-pressed="false">Rest</button></div>
<article class="sheet" aria-live="polite"><div class="edition"><span>Compass / Almanac</span><span>Editorial draft</span></div><div class="page"></div><div class="foot"></div></article>
</div>
<script>
(()=>{const root=document.getElementById('compass-story');const page=root.querySelector('.page');const foot=root.querySelector('.foot');let current=0;const state={evidence:true};
const rows=(items)=>items.map(([d,t,e])=>`<div class="row"><div class="date">${d}</div><div>${t}${state.evidence&&e?`<span class="reason">${e}</span>`:''}</div></div>`).join('');
function render(){root.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.page===current)));if(current===0){page.innerHTML='<h2>A month for<br>the things<br>you want to do.</h2><div class="intro">September 11–October 10, 2026</div><div class="coverline">Move your body<br>Make something<br>Spend time together<br>Leave room to rest</div>';foot.textContent='Astrological dates and broader periods, selected by activity. Swipe for the month ahead.';}
if(current===1){page.innerHTML='<h2>The month ahead</h2>'+rows([['SEP 10','New Moon in Virgo','Thursday night · Opening context'],['SEP 18','First Quarter in Sagittarius','Friday afternoon'],['SEP 22','The September equinox','Sun enters Libra · Tuesday evening'],['SEP 26','Full Moon in Aries','Saturday morning'],['SEP 27','Mars enters Leo','Sunday evening · See workouts'],['SEP 30','Mercury enters Scorpio','Wednesday morning'],['OCT 3','Last Quarter in Cancer','Venus also stations retrograde in Scorpio'],['OCT 10','New Moon in Libra','Saturday morning']]);foot.textContent='CST (UTC−6). Exact boundaries and source notes accompany the edition.';}
if(current===2){page.innerHTML='<h2>Move your body</h2><div class="intro">Keep a familiar routine while Mars is in Cancer; from September 27, try something more playful as Mars enters Leo.</div>'+rows([['SEP 14–16','Focused physical effort','Broader theme · Scorpio Moon'],['SEP 19–21','A structured training session','Broader theme · Capricorn Moon'],['★ SEP 21','A highlighted opening Monday morning','Moon trine Sun + Sun sextile Mars'],['SEP 26–28','Active, vigorous movement','Broader theme · Aries Moon'],['OCT 4–6','Dance, sport, or a lively class','Broader theme · Leo Moon; Mars also in Leo']]);foot.textContent='★ A checked opening with independent planetary support. Date ranges are broader themes, not continuous recommendations. CST.';}
if(current===3){page.innerHTML='<h2>Leave room<br>to rest</h2><div class="intro">Seven void-of-course periods to keep less scheduled, when you have the choice.</div>'+rows([['SEP 13','Sunday afternoon and evening',''],['SEP 23','Most of Wednesday','Into the evening'],['SEP 29–30','Tuesday evening through Wednesday morning','Taurus Moon'],['OCT 2','Friday morning into early afternoon',''],['OCT 3–4','Much of the weekend','Cancer Moon + last-quarter phase'],['OCT 6','Tuesday daytime and evening',''],['OCT 7–8','Wednesday afternoon through Thursday','Ends early Friday']]);foot.textContent='Void of course: after the final major lunar aspect to a classical planet, before the Moon changes signs. CST. Full boundaries in the reference.';}}
root.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.page;render();}));render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'evidence',{label:'Show evidence lines'});}})();
</script>
