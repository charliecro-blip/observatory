        date:
          type: ["string", "null"]
        capacityLevel:
          type: ["string", "null"]
          description: "Low | Medium | High"
        capacityScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        bodyWeatherSummary:
          type: ["string", "null"]
        bestUseTags:
          type: ["array", "null"]
          items:
            type: string
        watchForTags:
          type: ["array", "null"]
          items:
            type: string
        supportTags:
          type: ["array", "null"]
          items:
            type: string
        explanation:
          type: ["string", "null"]
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

