        mood:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        stress:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        focus:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        digestion:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        sleepQuality:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        pain:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        regulation:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        symptomTags:
          type: ["array", "null"]
          items:
            type: string
        behaviorTags:
          type: ["array", "null"]
          items:
            type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, date, createdAt, updatedAt]

    UpsertCheckInBody:
      type: object
      properties:
        date:
          type: string
          description: "YYYY-MM-DD. Defaults to today if omitted."
        energy:
          type: ["integer", "null"]
